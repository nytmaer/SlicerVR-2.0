<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlicerVR 2.0095</title>

<style>
* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
}

body {
    font-family:sans-serif;
    background:#0a0a0f;
    color:white;
}

/* Upload */
.upload-card {
    position:relative;
    margin:30px;
    padding:40px;
    border:2px dashed #333;
    border-radius:16px;
    text-align:center;
    cursor:pointer;
    touch-action:auto;
}

.upload-card:hover {
    border-color:#00d4ff;
}

#fileInput {
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
    z-index:10;
}

/* Video */
video {
    width:100%;
    max-height:40vh;
    background:black;
    border-radius:12px;
    margin:10px 0;
}

/* Timeline */
.timeline {
    margin:20px;
    height:50px;
    background:#222;
    border-radius:10px;
    position:relative;
}

.selection {
    position:absolute;
    top:0;
    bottom:0;
    background:#00d4ff55;
}

.handle {
    position:absolute;
    width:12px;
    top:0;
    bottom:0;
    background:#00d4ff;
    cursor:ew-resize;
}

/* Controls */
.controls {
    display:flex;
    gap:10px;
    padding:20px;
}

button {
    padding:12px;
    border:none;
    border-radius:10px;
    background:#00d4ff;
    cursor:pointer;
    font-weight:bold;
}

button:disabled {
    opacity:0.4;
}
</style>
</head>

<body>

<label class="upload-card" id="uploadCard">
    <input type="file" id="fileInput" accept="video/*">
    <h2>📁 Select or Drop Video</h2>
    <p>Desktop • Mobile • Quest Ready</p>
</label>

<video id="video" controls playsinline></video>

<div class="timeline" id="timeline">
    <div class="selection" id="selection"></div>
    <div class="handle" id="leftHandle"></div>
    <div class="handle" id="rightHandle"></div>
</div>

<div class="controls">
    <button id="exportBtn">Export Clip</button>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const video = document.getElementById('video');
const timeline = document.getElementById('timeline');
const selection = document.getElementById('selection');
const leftHandle = document.getElementById('leftHandle');
const rightHandle = document.getElementById('rightHandle');
const uploadCard = document.getElementById('uploadCard');

let state = {
    duration:0,
    left:0,
    right:100,
    dragging:null
};

/* =========================
   FILE LOAD (WORKS EVERYWHERE)
========================= */
fileInput.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;

    const url = URL.createObjectURL(file);
    video.src = url;
});

/* =========================
   VIDEO META
========================= */
video.addEventListener('loadedmetadata', ()=>{
    state.duration = video.duration;
});

/* =========================
   TIMELINE
========================= */
function updateUI(){
    selection.style.left = state.left + '%';
    selection.style.right = (100 - state.right) + '%';

    leftHandle.style.left = state.left + '%';
    rightHandle.style.left = state.right + '%';
}

function pctToTime(p){
    return (p/100)*state.duration;
}

function snap(t){
    return Math.round(t/0.5)*0.5;
}

/* =========================
   DRAG SYSTEM
========================= */
function startDrag(type){
    state.dragging = type;
}

function stopDrag(){
    state.dragging = null;
}

function moveDrag(e){
    if(!state.dragging) return;

    const rect = timeline.getBoundingClientRect();
    const pct = ((e.clientX - rect.left)/rect.width)*100;

    const time = snap(pctToTime(pct));
    const snappedPct = (time/state.duration)*100;

    if(state.dragging === 'left'){
        state.left = Math.min(snappedPct, state.right - 1);
    }

    if(state.dragging === 'right'){
        state.right = Math.max(snappedPct, state.left + 1);
    }

    updateUI();
}

leftHandle.addEventListener('mousedown', ()=>startDrag('left'));
rightHandle.addEventListener('mousedown', ()=>startDrag('right'));

window.addEventListener('mouseup', stopDrag);
window.addEventListener('mousemove', moveDrag);

/* =========================
   DRAG DROP (DESKTOP ONLY)
========================= */
if(!('ontouchstart' in window)){
    uploadCard.addEventListener('dragover', e=>{
        e.preventDefault();
    });

    uploadCard.addEventListener('drop', e=>{
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if(file){
            video.src = URL.createObjectURL(file);
        }
    });
}

/* =========================
   EXPORT (QUEST SAFE)
========================= */
document.getElementById('exportBtn').onclick = async ()=>{

    if(!video.duration) return;

    const start = pctToTime(state.left);
    const end = pctToTime(state.right);

    const canvas = document.createElement('canvas');
    canvas.width = 640;
    canvas.height = 360;

    const ctx = canvas.getContext('2d');

    const stream = canvas.captureStream(30);
    const recorder = new MediaRecorder(stream, { mimeType:'video/webm' });

    const chunks = [];

    recorder.ondataavailable = e=>{
        if(e.data.size > 0) chunks.push(e.data);
    };

    recorder.onstop = ()=>{
        const blob = new Blob(chunks, {type:'video/webm'});
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = `SlicerVR_${Date.now()}.webm`;
        a.click();

        setTimeout(()=>URL.revokeObjectURL(url),1000);
    };

    recorder.start();

    video.currentTime = start;

    await new Promise(r=>video.onseeked = r);

    video.play();

    function draw(){
        if(video.currentTime >= end){
            recorder.stop();
            video.pause();
            return;
        }

        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        requestAnimationFrame(draw);
    }

    draw();
};

updateUI();
</script>

</body>
</html>
