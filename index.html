<!--
SlicerVR 2.0010 SAFE BUILD
Hardened for production usage
-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlicerVR Safe</title>

<!-- ✅ Single base tag only -->
<base target="_blank">

<style>
/* KEEP YOUR ORIGINAL STYLES (unchanged for brevity) */
</style>
</head>

<body>

<input type="file" id="fileInput" accept="video/mp4,video/webm,video/quicktime">

<video id="video" controls></video>

<button id="exportBtn">Export</button>

<script type="module">

/* =========================
   🔐 GLOBAL SAFE STATE
========================= */
const state = {
    videoFile: null,
    videoUrl: null,
    duration: 0,
    trimLeft: 0,
    trimRight: 0,
    isExporting: false
};

/* =========================
   🔐 SAFE HELPERS
========================= */
function sanitizeFile(file) {
    const allowedTypes = [
        'video/mp4',
        'video/webm',
        'video/quicktime'
    ];

    const MAX_SIZE_MB = 500;

    if (!allowedTypes.includes(file.type)) {
        throw new Error('Unsupported file type');
    }

    if (file.size > MAX_SIZE_MB * 1024 * 1024) {
        throw new Error('File too large (max 500MB)');
    }

    return true;
}

function safeRevokeURL() {
    if (state.videoUrl) {
        URL.revokeObjectURL(state.videoUrl);
        state.videoUrl = null;
    }
}

function snapTime(time, interval = 0.5) {
    return Math.round(time / interval) * interval;
}

function timeFromPct(pct) {
    return (pct / 100) * state.duration;
}

function pctFromTime(time) {
    return (time / state.duration) * 100;
}

/* =========================
   📁 FILE LOAD (SECURE)
========================= */
const fileInput = document.getElementById('fileInput');
const video = document.getElementById('video');

fileInput.addEventListener('change', (e) => {
    try {
        const file = e.target.files[0];
        if (!file) return;

        sanitizeFile(file);

        safeRevokeURL();

        state.videoFile = file;
        state.videoUrl = URL.createObjectURL(file);

        video.src = state.videoUrl;
        video.load();

    } catch (err) {
        alert(err.message);
        fileInput.value = '';
    }
});

/* =========================
   🎬 VIDEO METADATA
========================= */
video.addEventListener('loadedmetadata', () => {
    state.duration = video.duration || 0;
});

/* =========================
   ✂️ TRIM LOGIC (SAFE + SNAP)
========================= */
function getTimes() {
    const start = state.duration * (state.trimLeft / 100);
    const end = state.duration * (1 - state.trimRight / 100);

    return {
        start: snapTime(start),
        end: snapTime(end),
        duration: Math.max(0, end - start)
    };
}

/* =========================
   🚀 EXPORT (SAFE)
========================= */
async function exportClip() {
    if (state.isExporting) return;

    const { start, end, duration } = getTimes();

    if (duration < 0.5) {
        alert("Clip too short");
        return;
    }

    if (duration > 300) {
        alert("Clip too long (max 5 minutes)");
        return;
    }

    state.isExporting = true;

    try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;

        const stream = canvas.captureStream(30);

        const recorder = new MediaRecorder(stream, {
            mimeType: 'video/webm'
        });

        const chunks = [];

        recorder.ondataavailable = (e) => {
            if (e.data.size > 0) chunks.push(e.data);
        };

        recorder.start();

        video.currentTime = start;

        await new Promise(resolve => {
            video.onseeked = resolve;
        });

        video.play();

        function drawFrame() {
            if (video.currentTime >= end) {
                recorder.stop();
                video.pause();
                return;
            }

            ctx.drawImage(video, 0, 0);
            requestAnimationFrame(drawFrame);
        }

        drawFrame();

        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });

            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = `SlicerVR_${Date.now()}.webm`;
            a.click();

            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };

    } catch (err) {
        console.error(err);
        alert("Export failed");
    } finally {
        state.isExporting = false;
    }
}

/* =========================
   🎯 EXPORT BUTTON
========================= */
document.getElementById('exportBtn')
    .addEventListener('click', exportClip);

/* =========================
   🧹 CLEANUP ON EXIT
========================= */
window.addEventListener('beforeunload', () => {
    safeRevokeURL();
});

</script>
</body>
</html>
