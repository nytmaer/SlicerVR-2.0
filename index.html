<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlicerVR Universal</title>

<base target="_blank">

<style>
body {
    margin:0;
    font-family:sans-serif;
    background:#0a0a0f;
    color:white;
}

/* Upload Card */
.upload-card {
    position:relative;
    margin:40px;
    padding:40px;
    border:2px dashed #333;
    border-radius:16px;
    text-align:center;
    cursor:pointer;
}

.upload-card:hover {
    border-color:#00d4ff;
}

/* Invisible Input */
#fileInput {
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
}

/* Video */
video {
    width:100%;
    max-height:40vh;
    background:black;
    border-radius:12px;
}

/* Timeline */
.timeline {
    margin:20px;
    height:40px;
    background:#222;
    position:relative;
    border-radius:8px;
}

.selection {
    position:absolute;
    top:0;
    bottom:0;
    background:#00d4ff55;
}

.handle {
    position:absolute;
    width:10px;
    top:0;
    bottom:0;
    background:#00d4ff;
    cursor:ew-resize;
}

/* Buttons */
.controls {
    display:flex;
    gap:10px;
    padding:20px;
}

button {
    padding:10px;
    border:none;
    border-radius:8px;
    background:#00d4ff;
    cursor:pointer;
}

button:disabled {
    opacity:0.5;
}
</style>
</head>

<body>

<!-- Upload -->
<label class="upload-card" id="uploadCard">
    <input type="file" id="fileInput" accept="video/*">
    <h2>📁 Select or Drop Video</h2>
</label>

<!-- Video -->
<video id="video" controls></video>

<!-- Timeline -->
<div class="timeline" id="timeline">
    <div class="selection" id="selection"></div>
    <div class="handle" id="leftHandle"></div>
    <div class="handle" id="rightHandle"></div>
</div>

<!-- Controls -->
<div class="controls">
    <button id="exportBtn">Export</button>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const video = document.getElementById('video');
const timeline = document.getElementById('timeline');
const selection = document.getElementById('selection');
const leftHandle = document.getElementById('leftHandle');
const rightHandle = document.getElementById('rightHandle');

let state = {
    duration:0,
    left:0,
    right:100,
    dragging:null
};

/* =====================
   FILE LOAD
===================== */
fileInput.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;

    const url = URL.createObjectURL(file);
    video.src = url;
});

/* =====================
   VIDEO META
===================== */
video.addEventListener('loadedmetadata', ()=>{
    state.duration = video.duration;
});

/* =====================
   TIMELINE
===================== */
function updateUI(){
    selection.style.left = state.left + '%';
    selection.style.right = (100 - state.right) + '%';

    leftHandle.style.left = state.left + '%';
    rightHandle.style.left = state.right + '%';
}

function getTimeFromPct(p){
    return (p/100)*state.duration;
}

function snap(t){
    return Math.round(t/0.5)*0.5;
}

/* =====================
   DRAG
===================== */
function startDrag(type){
    state.dragging = type;
}

function stopDrag(){
    state.dragging = null;
}

function moveDrag(e){
    if(!state.dragging) return;

    const rect = timeline.getBoundingClientRect();
    const pct = ((e.clientX - rect.left)/rect.width)*100;

    const time = snap(getTimeFromPct(pct));
    const snappedPct = (time/state.duration)*100;

    if(state.dragging === 'left'){
        state.left = Math.min(snappedPct, state.right - 1);
    }

    if(state.dragging === 'right'){
        state.right = Math.max(snappedPct, state.left + 1);
    }

    updateUI();
}

leftHandle.addEventListener('mousedown', ()=>startDrag('left'));
rightHandle.addEventListener('mousedown', ()=>startDrag('right'));

window.addEventListener('mouseup', stopDrag);
window.addEventListener('mousemove', moveDrag);

/* =====================
   DRAG DROP (DESKTOP)
===================== */
if(!('ontouchstart' in window)){
    uploadCard.addEventListener('dragover', e=>{
        e.preventDefault();
    });

    uploadCard.addEventListener('drop', e=>{
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if(file){
            video.src = URL.createObjectURL(file);
        }
    });
}

/* =====================
   EXPORT (QUEST SAFE)
===================== */
document.getElementById('exportBtn').onclick = async ()=>{
    if(!video.duration) return;

    const start = getTimeFromPct(state.left);
    const end = getTimeFromPct(state.right);

    const canvas = document.createElement('canvas');
    canvas.width = 640;
    canvas.height = 360;
    const ctx = canvas.getContext('2d');

    const stream = canvas.captureStream(30);
    const recorder = new MediaRecorder(stream);

    const chunks = [];

    recorder.ondataavailable = e=>{
        if(e.data.size>0) chunks.push(e.data);
    };

    recorder.onstop = ()=>{
        const blob = new Blob(chunks, {type:'video/webm'});
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = 'clip.webm';
        a.click();
    };

    recorder.start();

    video.currentTime = start;

    await new Promise(r=>video.onseeked=r);

    video.play();

    function draw(){
        if(video.currentTime >= end){
            recorder.stop();
            video.pause();
            return;
        }

        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        requestAnimationFrame(draw);
    }

    draw();
};

updateUI();
</script>

</body>
</html>
